<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Logique combinatoire — STI2D</title>
<style>
  :root{
    --bg:#f2f6f3; --card:#ffffff; --ink:#12211a; --muted:#5c6b63;
    --line:#e1e8e3; --primary:#1c7a4c; --primary-2:#12603a; --primary-soft:#e8f5ee;
    --accent:#6d28d9; --accent-soft:#f1ecfe;
    --ok:#12743f; --ok-bg:#e6f7ec; --ok-line:#b7e3c6;
    --ko:#a81818; --ko-bg:#fdeceb; --ko-line:#f4bcb8;
    --warn:#8a5a00; --warn-bg:#fff6e0;
    --gold:#e0a300; --copper:#b06a20;
    --radius:16px; --shadow:0 10px 30px rgba(14,40,26,.10);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0e1512; --card:#151d19; --ink:#e9f2ec; --muted:#9db0a5;
      --line:#26332c; --primary:#57c98d; --primary-2:#7ee0a8; --primary-soft:#14301f;
      --accent:#b79bfb; --accent-soft:#241a44;
      --ok:#6fe0a3; --ok-bg:#10291c; --ok-line:#1e4a32;
      --ko:#ff9a92; --ko-bg:#2e1614; --ko-line:#5a2b27;
      --warn:#f0c265; --warn-bg:#2b2312;
      --gold:#ffcc4d; --copper:#e8a05a;
      --shadow:0 10px 30px rgba(0,0,0,.4);
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:'Raleway',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    font-size:16px; line-height:1.5;
  }
  .wrap{max-width:960px;margin:0 auto;padding:18px 16px 32px}

  /* ---------- En-tête ---------- */
  .hero{
    display:flex;align-items:center;gap:16px;justify-content:space-between;
    background:linear-gradient(135deg,var(--primary),var(--accent));
    color:#fff;border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow);
  }
  .hero h1{margin:0;font-size:1.35rem;letter-spacing:.3px}
  .hero p{margin:4px 0 0;font-size:.85rem;opacity:.92}
  .hero-score{text-align:center;background:rgba(255,255,255,.16);border-radius:14px;padding:8px 16px;min-width:86px}
  .hero-score b{display:block;font-size:1.7rem;line-height:1}
  .hero-score small{font-size:.7rem;text-transform:uppercase;letter-spacing:1px;opacity:.9}

  /* ---------- Barre d'onglets ---------- */
  .toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin:16px 0 10px}
  .modes{display:flex;flex-wrap:wrap;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px}
  .modes button{
    border:0;background:transparent;color:var(--muted);font:inherit;font-size:.88rem;font-weight:600;
    padding:8px 14px;border-radius:999px;cursor:pointer;transition:.2s;white-space:nowrap;
  }
  .modes button:hover{color:var(--ink)}
  .modes button.active{background:var(--primary);color:#fff}
  .stats{display:flex;gap:12px;align-items:center;font-size:.82rem;color:var(--muted);font-weight:600}
  #btnReset{border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:999px;padding:6px 12px;font:inherit;font-size:.78rem;cursor:pointer}
  #btnReset:hover{color:var(--ink);border-color:var(--muted)}

  /* ---------- Cartes ---------- */
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px;margin-bottom:16px}
  .qkind{display:inline-block;font-size:.7rem;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;
    color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:4px 12px;margin-bottom:12px}
  h2{font-size:1.05rem;margin:0 0 10px}
  h3{font-size:.95rem;margin:18px 0 8px}
  p{margin:.5em 0}
  .lead{color:var(--muted);font-size:.95rem}

  /* ---------- Parcours ---------- */
  .paliers{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
  .palier{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;text-align:left}
  .palier.dispo{box-shadow:var(--shadow);border-color:var(--primary)}
  button.palier{cursor:pointer;font:inherit;color:inherit}
  button.palier:hover{border-color:var(--primary-2);transform:translateY(-1px)}
  .palier .num{font-size:.72rem;font-weight:800;letter-spacing:1px;color:var(--muted)}
  .palier .tt{font-weight:800;margin:2px 0 4px}
  .palier .rs{font-size:.85rem;color:var(--muted)}
  .tag{display:inline-block;font-size:.68rem;font-weight:800;letter-spacing:.8px;text-transform:uppercase;
    border-radius:999px;padding:2px 9px;margin-top:8px}
  .tag.bases{background:var(--primary-soft);color:var(--primary-2)}
  .tag.avance{background:var(--accent-soft);color:var(--accent)}
  .soon{font-size:.72rem;color:var(--muted);font-style:italic}

  /* ---------- Montage / panneau ---------- */
  .board{display:grid;grid-template-columns:1.05fr .95fr;gap:16px;align-items:start}
  @media (max-width:820px){.board{grid-template-columns:1fr}}
  .panel{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:14px}
  .panel > h3{margin-top:0}
  .circuit{width:100%;height:auto;color:var(--ink);transition:.2s}
  .wire{stroke:currentColor;stroke-width:2;fill:none}
  /* le courant circule quand le circuit est fermé */
  .circuit.live .wire{stroke:var(--copper);stroke-dasharray:6 7;animation:flow .8s linear infinite}
  @keyframes flow{to{stroke-dashoffset:-13}}
  .cdot{fill:currentColor}
  .blade{stroke:currentColor;stroke-width:2}
  .ncbar{stroke:currentColor;stroke-width:2}
  .battery{stroke:currentColor;stroke-width:2.5}
  .clabel{fill:currentColor;font-size:13px;font-family:inherit;text-anchor:middle}
  .csub{fill:var(--muted);font-size:10px;text-anchor:middle}
  .circuit .contact .blade-open{display:block}
  .circuit .contact .blade-closed{display:none}
  .circuit .contact.closed .blade-open{display:none}
  .circuit .contact.closed .blade-closed{display:block}
  .lamp .lbulb{fill:none;stroke:currentColor;stroke-width:2}
  .lamp .lcross{stroke:currentColor;stroke-width:1.6}
  .lamp.lit{color:var(--gold)}
  .lamp.lit .lbulb{fill:var(--gold);stroke:var(--gold);filter:drop-shadow(0 0 6px var(--gold))}
  .lamp.lit .lcross{stroke:var(--card)}

  .gate{width:100%;max-width:210px;height:auto;display:block;margin:0 auto;color:var(--ink)}
  .sym-bloc{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px;margin:6px 0 10px}
  .deriv{font-size:.95rem;font-weight:700;margin:2px 0 10px;line-height:1.6;font-variant-numeric:tabular-nums}
  .mini{font-size:.72em;color:var(--muted);font-weight:600}
  .choices.two{grid-template-columns:1fr 1fr}
  .gbox{fill:none;stroke:currentColor;stroke-width:2}
  .gw{stroke:currentColor;stroke-width:2}
  .gbub{fill:var(--card);stroke:currentColor;stroke-width:2}
  .gmark{fill:currentColor;font-size:20px;font-weight:700;font-family:inherit}
  .glabel{fill:currentColor;font-size:13px;font-weight:600;font-family:inherit}

  /* ---------- Interrupteurs ---------- */
  .switches{display:flex;flex-wrap:wrap;gap:10px;margin:4px 0 12px}
  .switch{
    display:flex;align-items:center;gap:9px;background:var(--card);border:2px solid var(--line);
    border-radius:12px;padding:8px 12px;font:inherit;cursor:pointer;transition:.15s;color:var(--ink);
  }
  .switch:hover{border-color:var(--primary)}
  .switch .sw-name{font-weight:800;font-size:1.05rem}
  .switch .sw-state{font-weight:800;font-variant-numeric:tabular-nums;color:var(--muted)}
  .switch .sw-knob{width:34px;height:18px;border-radius:999px;background:var(--line);position:relative;transition:.15s}
  .switch .sw-knob::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--card);transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
  .switch[aria-checked="true"]{border-color:var(--primary);background:var(--primary-soft)}
  .switch[aria-checked="true"] .sw-state{color:var(--primary-2)}
  .switch[aria-checked="true"] .sw-knob{background:var(--primary)}
  .switch[aria-checked="true"] .sw-knob::after{left:18px}
  .switch:disabled{opacity:.4;cursor:not-allowed}
  .state-line{font-size:.9rem;font-weight:600;font-variant-numeric:tabular-nums;color:var(--muted)}
  .state-line b{color:var(--ink)}

  .fn-picker{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
  .fn-picker button{
    border:2px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:700;
    padding:8px 16px;border-radius:999px;cursor:pointer;transition:.15s;
  }
  .fn-picker button:hover{border-color:var(--primary)}
  .fn-picker button.active{background:var(--primary);color:#fff;border-color:var(--primary)}
  .fn-picker .extra{font-size:.82rem;font-weight:600;color:var(--muted);border:1px dashed var(--line);background:transparent}
  .fn-picker .extra.active{background:var(--accent-soft);color:var(--accent);border-color:var(--accent);border-style:solid}

  /* ---------- Équation ---------- */
  .eq{font-size:1.35rem;font-weight:800;text-align:center;letter-spacing:.5px;margin:10px 0 4px;font-variant-numeric:tabular-nums}
  .eq-cap{text-align:center;font-size:.78rem;color:var(--muted);margin-bottom:8px}
  .op{display:inline-block;background:var(--accent-soft);color:var(--accent);border-radius:6px;padding:2px 9px;font-size:1.05em;font-weight:800;margin:0 4px}
  /* La barre de négation doit être visible PARTOUT : équations, QCM, corrections, mémo */
  .ovl{text-decoration:overline;padding:0 2px}
  .eq-inline{font-weight:800;font-variant-numeric:tabular-nums}
  .conv-list{list-style:none;padding:0;margin:12px 0 0}
  .conv-list li{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);flex-wrap:wrap}
  .conv-list li:first-child{border-top:0}
  .sym{display:inline-block;min-width:46px;padding:6px 10px;text-align:center;font-size:1.5rem;font-weight:800;line-height:1.15;background:var(--accent-soft);color:var(--accent);border-radius:10px}
  .sym.ovl{text-decoration:overline}

  /* ---------- Table de vérité ---------- */
  table.tt{width:100%;border-collapse:collapse;font-size:.9rem;font-variant-numeric:tabular-nums}
  table.tt th,table.tt td{border:1px solid var(--line);padding:6px 8px;text-align:center}
  table.tt th{background:var(--primary-soft);color:var(--primary-2);font-weight:700}
  table.tt tbody tr{cursor:pointer}
  table.tt tbody tr:not(.cur):hover{background:var(--bg)}
  table.tt tbody tr.cur{background:var(--accent-soft);font-weight:800}
  table.tt tbody tr.one td.out{color:var(--ok);font-weight:800}
  table.tt tbody tr.sel{outline:2px solid var(--accent);outline-offset:-2px}
  table.tt td.out{font-weight:700}
  table.tt td.mnum{color:var(--muted);font-weight:600;font-size:.85em}
  /* colonne S cliquable de l'exercice */
  table.tt td[data-srow]{cursor:pointer;user-select:none}
  table.tt td[data-srow]:hover{outline:2px solid var(--accent);outline-offset:-2px}
  table.tt td.cell.v1{color:var(--ok);font-weight:800}
  table.tt td.cell.v0{color:var(--muted);font-weight:700}
  table.tt td.good{color:var(--ok);font-weight:800}
  table.tt td.ko-cell{color:var(--ko);font-weight:800}
  /* tableaux de texte (vocabulaire, équivalences) */
  table.voc{width:100%;border-collapse:collapse;font-size:.88rem}
  table.voc th,table.voc td{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top}
  table.voc th{background:var(--primary-soft);color:var(--primary-2);font-weight:700}
  table.voc td.verif{white-space:nowrap;color:var(--ok);font-weight:700}

  /* ---------- Bandeaux ---------- */
  .why{margin-top:12px;background:var(--primary-soft);color:var(--primary-2);border-radius:12px;padding:12px 14px;font-size:.9rem}
  .why b{color:var(--primary-2)}
  .conventions{margin-top:10px;background:var(--bg);border:1px dashed var(--line);border-radius:12px;padding:10px 14px;font-size:.85rem;color:var(--muted)}
  .conventions code{background:var(--primary-soft);color:var(--primary-2);border-radius:5px;padding:1px 6px}
  .feedback{display:none;margin-top:14px;border-radius:12px;padding:14px 16px;border:1px solid var(--line);font-size:.95rem}
  .feedback.show{display:block}
  .feedback.good{background:var(--ok-bg);border-color:var(--ok-line)}
  .feedback.bad{background:var(--ko-bg);border-color:var(--ko-line)}
  .feedback .title{font-weight:800;display:block;margin-bottom:6px}
  .feedback.good .title{color:var(--ok)}
  .feedback.bad .title{color:var(--ko)}

  .actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:14px}
  button.primary{border:0;background:var(--primary);color:#fff;font:inherit;font-weight:700;cursor:pointer;padding:12px 20px;border-radius:12px;transition:.2s;font-size:.95rem}
  button.primary:hover{background:var(--primary-2)}
  button.ghost{border:1px solid var(--line);background:transparent;color:var(--muted);font:inherit;font-weight:600;cursor:pointer;padding:10px 16px;border-radius:12px;font-size:.85rem}
  button.ghost:hover{color:var(--ink);border-color:var(--muted)}

  .choices{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
  @media (max-width:620px){.choices{grid-template-columns:1fr}}
  .choices button{
    text-align:left;padding:14px 16px;font:inherit;font-size:1.05rem;font-weight:700;color:var(--ink);
    background:var(--bg);border:2px solid var(--line);border-radius:12px;cursor:pointer;transition:.18s;font-variant-numeric:tabular-nums;
  }
  .choices button:hover{border-color:var(--primary);background:var(--primary-soft)}
  .choices button.ok{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
  .choices button.ko{border-color:var(--ko);background:var(--ko-bg);color:var(--ko)}
  .choices button:disabled{cursor:default;opacity:.55}
  .choices button.ok:disabled,.choices button.ko:disabled{opacity:1}

  /* ---------- Mémo ---------- */
  .memo h2{margin-top:24px}
  .memo table{width:100%;border-collapse:collapse;font-size:.88rem;background:var(--card);border-radius:12px;overflow:hidden}
  .memo th,.memo td{border:1px solid var(--line);padding:8px 10px;text-align:left}
  .memo th{background:var(--primary-soft);color:var(--primary-2);font-weight:700}
  .memo td:first-child{font-weight:700}
  .memo .ex{background:var(--card);border-left:4px solid var(--primary);border-radius:0 12px 12px 0;padding:12px 16px;margin:10px 0;font-size:.92rem}
  .memo .trap{background:var(--ko-bg);border-left:4px solid var(--ko);border-radius:0 12px 12px 0;padding:12px 16px;margin:10px 0;font-size:.92rem}
  .memo ul{padding-left:22px}
  .memo li{margin:6px 0}

  /* ---------- Fin de défi ---------- */
  .end{text-align:center}
  .end .note{font-size:3.4rem;font-weight:800;line-height:1;color:var(--primary);margin:10px 0 4px}
  .end .appr{color:var(--muted);font-style:italic;margin-bottom:6px}
  .end .meta{font-size:.85rem;color:var(--muted);margin-bottom:18px}
  .recap{text-align:left;margin:18px 0 0}
  .recap h3{font-size:.85rem;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin:0 0 8px}
  .recap ul{list-style:none;padding:0;margin:0;font-size:.9rem}
  .recap li{border-left:3px solid var(--ko);background:var(--ko-bg);border-radius:0 10px 10px 0;padding:8px 12px;margin-bottom:7px}

  .footer-note{margin-top:16px;font-size:.78rem;color:var(--muted);text-align:center}
  kbd{background:var(--card);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 6px;font-size:.85em}
</style>
</head>
<body>
<div class="wrap">

  <header class="hero">
    <div>
      <h1>Logique combinatoire</h1>
      <p>STI2D — des interrupteurs à l'algèbre de Boole : on manipule, puis on formalise</p>
    </div>
    <div class="hero-score">
      <b id="scoreVal">0</b>
      <small id="scoreLbl">points</small>
    </div>
  </header>

  <div class="toolbar">
    <div class="modes" role="tablist" aria-label="Navigation">
      <button class="mode-btn active" data-view="parcours" role="tab">Parcours</button>
      <button class="mode-btn" data-view="p1" role="tab">Palier 1 · 0 et 1</button>
      <button class="mode-btn" data-view="p2" role="tab">Palier 2 · NON, ET, OU</button>
      <button class="mode-btn" data-view="p3" role="tab">Palier 3 · Canonique</button>
      <button class="mode-btn" data-view="p4" role="tab">Palier 4 · Énoncés</button>
      <button class="mode-btn" data-view="p5" role="tab">Palier 5 · NON-ET/NON-OU</button>
      <button class="mode-btn" data-view="p6" role="tab">Palier 6 · OU-exclusif</button>
      <button class="mode-btn" data-view="p7" role="tab">Palier 7 · Équivalences</button>
      <button class="mode-btn" data-view="p8" role="tab">Palier 8 · Missions</button>
      <button class="mode-btn" data-view="defi" role="tab">Défi</button>
      <button class="mode-btn" data-view="memo" role="tab">Mémo</button>
    </div>
    <div class="stats">
      <span id="statInfo">Parcours</span>
      <button id="btnReset" type="button">↺ Recommencer</button>
    </div>
  </div>

  <main id="view"></main>

  <p class="footer-note">Astuce : dans le montage, tout est cliquable — interrupteurs, lignes de la table de vérité.</p>
</div>

<script>
(function () {
  'use strict';

  /* =====================================================================
     1. DONNÉES — fonctions logiques et parcours
     ===================================================================== */
  var FUNCS = {
    IDENT: {
      id:'IDENT', label:'IDENTITÉ', long:'contact simple (S = A)', iec:'1', invert:false,
      minVars:1, maxVars:1,
      eq: function (v) { return 'S = ' + v[0]; },
      calc: function (v) { return v[0] ? 1 : 0; },
      phrase:'La lampe recopie l\'état de l\'interrupteur.',
      why:'Le contact est en <b>série</b> avec la lampe : elle s\'allume si et seulement si ' +
          'l\'interrupteur est fermé. La sortie <b>recopie</b> l\'entrée.'
    },
    NON: {
      id:'NON', label:'NON', long:'NON (inverseur)', iec:'1', invert:true,
      minVars:1, maxVars:1,
      eq: function (v) { return 'S = ' + bar(v[0]); },
      calc: function (v) { return v[0] ? 0 : 1; },
      phrase:'La lampe fait l\'inverse de A : elle s\'allume quand A = 0.',
      why:'Le contact est un <b>contact au repos</b> : il est fermé quand l\'interrupteur A est ouvert, ' +
          'donc quand A = 0. La lampe s\'allume alors que l\'interrupteur n\'est <b>pas</b> actionné : ' +
          'c\'est l\'<b>inverseur</b>.'
    },
    ET: {
      id:'ET', label:'ET', long:'ET (AND)', iec:'&', invert:false,
      minVars:2, maxVars:3,
      eq: function (v) { return 'S = ' + v.join('·'); },
      calc: function (v) { for (var i = 0; i < v.length; i++) { if (!v[i]) return 0; } return 1; },
      phrase:'La lampe s\'allume seulement si <b>toutes</b> les variables valent 1.',
      why:'Les contacts sont branchés en <b>série</b> : le courant doit traverser <b>tous</b> les contacts. ' +
          'Il suffit qu\'un seul soit ouvert pour que la lampe s\'éteigne.'
    },
    OU: {
      id:'OU', label:'OU', long:'OU (OR)', iec:'≥1', invert:false,
      minVars:2, maxVars:3,
      eq: function (v) { return 'S = ' + v.join('+'); },
      calc: function (v) { for (var i = 0; i < v.length; i++) { if (v[i]) return 1; } return 0; },
      phrase:'La lampe s\'allume dès qu\'au moins une variable vaut 1.',
      why:'Les contacts sont branchés en <b>parallèle</b> : il suffit qu\'<b>un seul</b> soit fermé ' +
          'pour que le courant passe par cette branche.'
    },
    NAND: {
      id:'NAND', label:'NON-ET', long:'NON-ET (NAND)', iec:'&', invert:true,
      minVars:2, maxVars:3,
      eq: function (v) { return 'S = ' + bar(v.join('·')); },
      calc: function (v) { for (var i = 0; i < v.length; i++) { if (!v[i]) return 1; } return 0; },
      phrase:'La lampe s\'éteint seulement si <b>toutes</b> les entrées valent 1.',
      why:'C\'est un <b>ET suivi d\'un inverseur</b> : le petit cercle (« bulle d\'inversion ») inverse ' +
          'la sortie du ET.'
    },
    NOR: {
      id:'NOR', label:'NON-OU', long:'NON-OU (NOR)', iec:'≥1', invert:true,
      minVars:2, maxVars:3,
      eq: function (v) { return 'S = ' + bar(v.join('+')); },
      calc: function (v) { for (var i = 0; i < v.length; i++) { if (v[i]) return 0; } return 1; },
      phrase:'La lampe s\'allume seulement si <b>toutes</b> les entrées valent 0.',
      why:'C\'est un <b>OU suivi d\'un inverseur</b> : la bulle inverse la sortie du OU.'
    },
    XOR: {
      id:'XOR', label:'OU-exclusif', long:'OU-exclusif (XOR)', iec:'=1', invert:false,
      minVars:2, maxVars:2,
      eq: function (v) { return 'S = ' + v[0] + ' ⊕ ' + v[1]; },
      calc: function (v) { return (v[0] !== v[1]) ? 1 : 0; },
      phrase:'La lampe s\'allume si les deux entrées sont <b>différentes</b>.',
      why:'C\'est un OU <b>exclusif</b> : « l\'un ou l\'autre, mais pas les deux ». ' +

          'donc aussi la détection d\'une <b>incohérence</b> entre deux capteurs.'
    }
  };

  var PALIERS = [

      resume:'Une information en tout ou rien : la variable logique, ses deux états, la table de vérité.' },

  var VARS3 = ['A','B','C'];

  /* =====================================================================
     2. MOTEUR LOGIQUE
     ===================================================================== */
  function bar(x) { return '<span class="ovl">' + x + '</span>'; }

  /* Variables utilisées par la fonction courante */
  function varsFor(fnId, third) {
    var f = FUNCS[fnId];
    if (f.maxVars === 1) return ['A'];
    /* la 3e entrée n'existe que si la fonction l'accepte */
    return (third && f.maxVars >= 3) ? ['A','B','C'] : ['A','B'];
  }

  /* Toutes les combinaisons d'entrées, dans l'ordre 000, 001, 010… */
  function allRows(fnId, varsArr) {
    var f = FUNCS[fnId], n = varsArr.length, out = [], total = Math.pow(2, n), i, k, v;
    for (i = 0; i < total; i++) {
      v = [];
      for (k = 0; k < n; k++) { v.push((i >> (n - 1 - k)) & 1); }
      out.push({ v: v, o: f.calc(v) });
    }
    return out;
  }

  /* Combinaisons qui allument la lampe (utile pour les exercices) */
  function onesOf(fnId, varsArr) {
    return allRows(fnId, varsArr).filter(function (r) { return r.o === 1; })
      .map(function (r) { return r.v.join(''); });
  }

  function evalFn(fnId, values) { return FUNCS[fnId].calc(values); }

  /* =====================================================================
     3. SVG — symbole normalisé, schéma à contacts, lampe
     ===================================================================== */
  function svgGate(fnId, varsArr) {
    var f = FUNCS[fnId], n = varsArr.length;
    var H = Math.max(50, n * 22 + 28), W = 150, bx = 40, bw = 58;
    var s = '<svg class="gate" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Symbole normalisé ' + f.long + '">';
    s += '<rect class="gbox" x="' + bx + '" y="7" width="' + bw + '" height="' + (H - 14) + '" rx="4"/>';
    s += '<text class="gmark" x="' + (bx + bw / 2) + '" y="' + (H / 2) + '" text-anchor="middle" dominant-baseline="central">' + f.iec + '</text>';
    for (var i = 0; i < n; i++) {
      var y = 7 + (H - 14) * (i + 1) / (n + 1);
      s += '<line class="gw wire" x1="6" y1="' + y + '" x2="' + bx + '" y2="' + y + '"/>';
      s += '<text class="glabel" x="8" y="' + (y - 6) + '">' + varsArr[i] + '</text>';
    }
    var yc = H / 2, xOut = f.invert ? W - 20 : W - 4;
    s += '<line class="gw wire" x1="' + (bx + bw) + '" y1="' + yc + '" x2="' + xOut + '" y2="' + yc + '"/>';
    if (f.invert) { s += '<circle class="gbub" cx="' + (W - 16) + '" cy="' + yc + '" r="4"/>'; }
    s += '<text class="glabel" x="' + (W - 10) + '" y="' + (yc - 9) + '">S</text>';
    s += '</svg>';
    return s;
  }

  function contactSym(x, y, label, inverted, labelBelow) {
    var s = '<g class="contact" data-contact="' + label + '">';
    s += '<line class="wire" x1="' + (x - 17) + '" y1="' + y + '" x2="' + (x - 4) + '" y2="' + y + '"/>';
    s += '<line class="wire" x1="' + (x + 4) + '" y1="' + y + '" x2="' + (x + 17) + '" y2="' + y + '"/>';
    s += '<circle class="cdot" cx="' + (x - 4) + '" cy="' + y + '" r="2.4"/>';
    s += '<circle class="cdot" cx="' + (x + 4) + '" cy="' + y + '" r="2.4"/>';
    /* position ouverte (blade levée) et position fermée : le CSS choisit selon .closed */
    s += '<line class="blade blade-open" x1="' + (x - 4) + '" y1="' + y + '" x2="' + (x + 9) + '" y2="' + (y - 12) + '"/>';
    s += '<line class="blade blade-closed" x1="' + (x - 4) + '" y1="' + y + '" x2="' + (x + 4) + '" y2="' + y + '"/>';
    if (inverted) { s += '<line class="ncbar" x1="' + (x - 6) + '" y1="' + (y - 7) + '" x2="' + (x + 6) + '" y2="' + (y + 7) + '"/>'; }
    if (labelBelow) { s += '<text class="clabel" x="' + x + '" y="' + (y + 24) + '">' + label + '</text>'; }
    else { s += '<text class="clabel" x="' + (x + 26) + '" y="' + (y + 4) + '">' + label + '</text>'; }
    s += '</g>';
    return s;
  }

  function wireSeg(x1, x2, y) {
    return '<line class="wire" x1="' + x1 + '" y1="' + y + '" x2="' + x2 + '" y2="' + y + '"/>';
  }

  function svgCircuit(fnId, varsArr) {
    var f = FUNCS[fnId], n = varsArr.length;
    var W = 380, yMain = 58, railL = 22, railR = 358;
    var midX = 190, nodeL = 112, nodeR = 268, step = 34;
    var half = (n - 1) / 2 * step;
    var yTop = (f.id === 'OU') ? yMain - half : yMain;
    var yBot = yMain + half + 76;
    var H = yBot + 34;
    var s = '<svg class="circuit" id="circuit" viewBox="0 0 ' + W + ' ' + H + '" data-lit="0" ' +
            'data-fn="' + f.id + '" data-vars="' + varsArr.join('') + '" role="img" ' +
            'aria-label="Schéma électrique équivalent à la fonction ' + f.label + '">';

    /* rails et ligne du bas avec le générateur */
    s += '<line class="wire" x1="' + railL + '" y1="' + yTop + '" x2="' + railL + '" y2="' + yBot + '"/>';
    s += '<line class="wire" x1="' + railR + '" y1="' + yTop + '" x2="' + railR + '" y2="' + yBot + '"/>';
    s += '<line class="wire" x1="' + railL + '" y1="' + yBot + '" x2="' + (W / 2 - 12) + '" y2="' + yBot + '"/>';
    s += '<line class="battery" x1="' + (W / 2 - 12) + '" y1="' + (yBot - 13) + '" x2="' + (W / 2 - 12) + '" y2="' + (yBot + 13) + '"/>';
    s += '<line class="battery" x1="' + (W / 2 + 12) + '" y1="' + (yBot - 7) + '" x2="' + (W / 2 + 12) + '" y2="' + (yBot + 7) + '"/>';
    s += '<line class="wire" x1="' + (W / 2 + 12) + '" y1="' + yBot + '" x2="' + railR + '" y2="' + yBot + '"/>';
    s += '<text class="csub" x="' + (W / 2) + '" y="' + (yBot + 30) + '">générateur</text>';

    var R = 17;   /* demi-largeur d'un symbole (contact ou lampe) */
    var lampRight = 312;

    if (f.id === 'OU') {
      /* parallèle : une branche par variable */
      s += wireSeg(railL, nodeL, yMain);
      s += '<line class="wire" x1="' + nodeL + '" y1="' + (yMain - half) + '" x2="' + nodeL + '" y2="' + (yMain + half) + '"/>';
      s += '<line class="wire" x1="' + nodeR + '" y1="' + (yMain - half) + '" x2="' + nodeR + '" y2="' + (yMain + half) + '"/>';
      for (var i = 0; i < n; i++) {
        var yb = yMain + (i - (n - 1) / 2) * step;
        s += wireSeg(nodeL, midX - R, yb);
        s += wireSeg(midX + R, nodeR, yb);
        s += contactSym(midX, yb, varsArr[i], false, false);
      }
      s += wireSeg(nodeR, lampRight - R, yMain);
      s += wireSeg(lampRight + R, railR, yMain);
      s += lampSym(lampRight, yMain);
    } else {
      /* série (ET, IDENT) ou contact au repos (NON) */
      var slots = n + 1, zone = 250, start = 74;
      var prev = railL, k, c;
      for (k = 0; k < n; k++) {
        c = start + (k + 0.5) * (zone / slots);
        s += wireSeg(prev, c - R, yMain);
        s += contactSym(c, yMain, varsArr[k], (f.id === 'NON'), true);
        prev = c + R;
      }
      var lampS = start + (n + 0.5) * (zone / slots);
      s += wireSeg(prev, lampS - R, yMain);
      s += wireSeg(lampS + R, railR, yMain);
      s += lampSym(lampS, yMain);
    }
    s += '</svg>';
    return s;
  }

  /* Logigramme : porte de base suivie d'un inverseur (NON-ET, NON-OU) */
  function svgCompose(baseId, varsArr) {
    var n = varsArr.length, base = FUNCS[baseId];
    var H = Math.max(58, n * 22 + 32), W = 320;
    var g1x = 34, g1w = 58, g2x = 186, g2w = 54;
    var s = '<svg class="circuit gate-comp" id="circuit" viewBox="0 0 ' + W + ' ' + H + '" data-lit="0" ' +
      'data-fn="' + (baseId === 'ET' ? 'NAND' : 'NOR') + '" data-vars="' + varsArr.join('') + '" role="img" ' +

    s += '<text class="gmark" x="' + (g1x + g1w / 2) + '" y="' + (H / 2) +

    }
    s += '<line class="gw wire" x1="' + (g1x + g1w) + '" y1="' + (H / 2) + '" x2="' + g2x + '" y2="' + (H / 2) + '"/>';
    s += '<rect class="gbox" x="' + g2x + '" y="' + (H / 2 - 20) + '" width="' + g2w + '" height="40" rx="4"/>';
    s += '<text class="gmark" x="' + (g2x + g2w / 2) + '" y="' + (H / 2) +
      '" text-anchor="middle" dominant-baseline="central">1</text>';
    s += '<circle class="gbub" cx="' + (g2x + g2w + 4) + '" cy="' + (H / 2) + '" r="4"/>';
    s += '<line class="gw wire" x1="' + (g2x + g2w + 8) + '" y1="' + (H / 2) + '" x2="' + (W - 14) + '" y2="' + (H / 2) + '"/>';
    s += '<text class="glabel" x="' + (W - 10) + '" y="' + (H / 2 - 9) + '">S</text>';
    s += '<text class="csub" x="' + (g2x + g2w / 2) + '" y="' + (H / 2 + 32) + '">inverseur</text>';
    s += '</svg>';
    return s;
  }

  /* Le montage : contacts pour les fonctions à contacts, logigramme sinon */

  /* ---------- Palier 5 : NON-ET et NON-OU, fonctions universelles ---------- */
  function universellesCard() {
    var nand = function (a, b) { return (a && b) ? 0 : 1; };
    var L = [
      { objet:'NON A', comment:'un NON-ET dont les deux entrées reçoivent A : S = ' + bar('A·A'),
        f1:function (v) { return v[0] ? 0 : 1; }, f2:function (v) { return nand(v[0], v[0]); }, n:1 },
      { objet:'A · B', comment:'un NON-ET suivi d\'un inverseur : la bulle annule l\'inversion',
        f1:function (v) { return (v[0] && v[1]) ? 1 : 0; },
        f2:function (v) { return nand(nand(v[0], v[1]), nand(v[0], v[1])); }, n:2 },
      { objet:'A + B', comment:'S = ' + bar(bar('A') + '·' + bar('B')) + ' : un NON-ET sur A, un sur B, puis un NON-ET',
        f1:function (v) { return (v[0] || v[1]) ? 1 : 0; },
        f2:function (v) { return nand(nand(v[0], v[0]), nand(v[1], v[1])); }, n:2 }
    ];
    var rows = L.map(function (l) {
      var ok = true, i, k, v;
      for (i = 0; i < Math.pow(2, l.n); i++) {
        v = [];
        for (k = 0; k < l.n; k++) { v.push((i >> (l.n - 1 - k)) & 1); }
        if (l.f1(v) !== l.f2(v)) ok = false;
      }

        '<td class="verif">' + (ok ? '✅ tables identiques' : '❌ non vérifié') + '</td></tr>';
    }).join('');

      eq: function () { return 'S = A·B + B·C + A·C'; },
      calc: function (v) { return (v[0] + v[1] + v[2]) >= 2 ? 1 : 0; },
      contexte:'Un voyant (S) s\'allume si au moins deux des trois capteurs A, B, C sont actifs.' },
    { id:'une', label:'Exactement une entrée',
      eq: function () { return 'S = A·' + bar('B') + '·' + bar('C') + ' + ' + bar('A') + '·B·' + bar('C') + ' + ' + bar('A') + '·' + bar('B') + '·C'; },
      calc: function (v) { return (v[0] + v[1] + v[2]) === 1 ? 1 : 0; },
      contexte:'S = 1 si exactement un des trois capteurs A, B, C est actif.' },
    { id:'parite', label:'Parité',
      eq: function () { return 'S = A ⊕ B ⊕ C'; },
      calc: function (v) { return ((v[0] + v[1] + v[2]) % 2) ? 1 : 0; },
      contexte:'S = 1 si le nombre de capteurs actifs est impair.' },
    { id:'et3', label:'Toutes les entrées',
      eq: function () { return 'S = A·B·C'; },
      calc: function (v) { return (v[0] && v[1] && v[2]) ? 1 : 0; },
      contexte:'S = 1 seulement si les trois capteurs sont actifs.' },
    { id:'ou3', label:'Au moins une entrée',
      eq: function () { return 'S = A + B + C'; },
      calc: function (v) { return (v[0] || v[1] || v[2]) ? 1 : 0; },
      contexte:'S = 1 dès qu\'au moins un capteur est actif.' }
  ];

  function f3courante() { return FONC3[state.f3] || FONC3[0]; }

  /* Phrase de correction : quelles combinaisons valent 1, et sous quels numéros de minterme */
  function sigmaLecture(fnc) {
    var L = lignes3(), ones = [], zeros = [], i;
    for (i = 0; i < L.length; i++) { if (L[i].o) { ones.push(L[i]); } else { zeros.push(L[i]); } }
    var txt = 'la sortie vaut 1 pour les combinaisons <b>' +
      ones.map(function (r) { return r.v.join(''); }).join(', ') +
      '</b>, dont les numéros de minterme sont <b>' +
      ones.map(function (r) { return r.i; }).join(', ') + '</b>';
    if (zeros.length) {
      txt += ', et vaut 0 pour <b>' + zeros.map(function (r) { return r.v.join(''); }).join(', ') +
        '</b> (numéro' + (zeros.length > 1 ? 's ' : ' ') +
        zeros.map(function (r) { return r.i; }).join(', ') + ')';
    }
    return txt;
  }

  /* Les 8 lignes de la table, pour une fonction donnée */
  function lignesFonc(fnc) {
    var out = [], i, k, v;
    for (i = 0; i < 8; i++) {
      v = [];
      for (k = 0; k < 3; k++) { v.push((i >> (2 - k)) & 1); }
      out.push({ i:i, v:v, o:fnc.calc(v) });
    }
    return out;
  }

  function lignes3() { return lignesFonc(f3courante()); }

  /* Mintermes : les lignes où S = 1 */
  function mintermes(fnc) {
    return lignes3().filter(function (r) { return fnc.calc(r.v) === 1; })
      .map(function (r) { return { i:r.i, v:r.v }; });
  }
  function listeMintermes(fnc) {
    return mintermes(fnc).map(function (r) { return r.i; });
  }
  /* Un produit par ligne à 1 : variable à 1 → lettre, variable à 0 → lettre barrée */
  function produitsCanoniques(fnc) {
    return mintermes(fnc).map(function (r) {
      return r.v.map(function (x, k) { return x ? VARS3[k] : bar(VARS3[k]); }).join('·');
    });
  }
  function eqCanonique(fnc) {
    var m = mintermes(fnc);
    if (!m.length) return 'S = 0';
    if (m.length === 8) return 'S = 1';
    return 'S = ' + produitsCanoniques(fnc).join(' + ');
  }
  function eqSigma(liste) {
    if (!liste.length) return 'S = 0';
    if (liste.length === 8) return 'S = 1';
    return 'S = Σ m(' + liste.join(', ') + ')';
  }

  /* De l'équation à la forme canonique */
  function renderPalier3() {
    var f = f3courante(), m = mintermes(f);
    var picker = FONC3.map(function (x) {
      return '<button data-f3="' + x.id + '"' + (x.id === f.id ? ' class="active"' : '') + '>' + x.label + '</button>';
    }).join('');
    var lignes = lignes3();
    var table = '<table class="tt" id="tt3"><thead><tr><th>m</th><th>A</th><th>B</th><th>C</th><th>S</th></tr></thead><tbody>' +
      lignes.map(function (r) {
        return '<tr class="' + (r.o ? 'one' : '') + '">' +
          '<td class="mnum">' + r.i + '</td>' +
          r.v.map(function (x) { return '<td>' + x + '</td>'; }).join('') +
          '<td class="out">' + r.o + '</td></tr>';
      }).join('') + '</tbody></table>';
    var lignes1 = m.length
      ? m.map(function (r) { return r.v.join('') + ' <span class="mini">m' + r.i + '</span>'; }).join(' &nbsp;·&nbsp; ')
      : 'aucune ligne à 1';
    var prod = m.length
      ? produitsCanoniques(f).join('<br>')
      : '—';

    return '<section class="card">' +
      '<span class="qkind">Palier 3 · Avancé</span>' +
      '<h2>De l\'équation à la forme canonique</h2>' +
      '<p class="lead">Toute fonction logique s\'écrit comme une <b>somme de produits</b> des entrées : ' +
      'un produit — un <b>minterme</b> — par ligne où S = 1. C\'est la <b>forme canonique</b>.</p>' +
      '<p class="lead"><b>Numéroter les mintermes —</b> le numéro d\'un minterme est la valeur binaire de ' +
      '(A, B, C) lue comme un nombre : la combinaison A = 0, B = 0, C = 0 porte le numéro <b>0</b>, ' +
      'et A = 1, B = 1, C = 1 porte le numéro <b>7</b>. C\'est ce numéro — et non le rang de la ligne dans ' +
      'le tableau — qui apparaît dans l\'écriture Σ m(...).</p>' +
      '<div class="fn-picker" id="f3Picker">' + picker + '</div>' +
      '<p class="lead">' + f.contexte + '</p>' +
      '<div class="board">' +
        '<div class="panel"><h3>La table de vérité</h3>' + table +
        '<p class="eq-cap">La colonne <b>m</b> donne le numéro du minterme (valeur binaire de ABC). ' +
        'Les lignes surlignées sont les mintermes, c\'est-à-dire celles où S = 1.</p></div>' +
        '<div class="panel"><h3>L\'écriture canonique</h3>' +
        '<p class="eq-cap">Équation de départ</p>' +
        '<p class="eq">' + f.eq() + '</p>' +
        '<p class="eq-cap">Combinaisons à 1 (mintermes)</p><p class="deriv">' + lignes1 + '</p>' +
        '<p class="eq-cap">Un produit par minterme</p><p class="deriv">' + prod + '</p>' +
        '<p class="eq-cap">Somme de ces produits : forme canonique</p>' +
        '<p class="eq">' + eqCanonique(f) + '</p>' +
        '<p class="eq-cap">Écriture condensée</p>' +
        '<p class="eq">' + eqSigma(listeMintermes(f)) + '</p>' +
        '</div>' +
      '</div>' +
      '<div class="why"><b>À retenir —</b> la forme canonique est <b>toujours vraie</b>, mais rarement la plus simple : ' +
      'ici elle compte <b>' + m.length + ' produit' + (m.length > 1 ? 's' : '') + '</b> (un par ligne où S = 1), ' +
      'alors que l\'équation de départ est bien plus courte. La simplifier avec les équivalences remarquables ' +
      '(De Morgan, absorption) sera l\'objet du <b>palier 7</b>.</div>' +
      '</section>' +
      '<section class="card" id="exoZone"></section>';
  }

  /* ---------- Exercice du palier 3 : écriture condensée Σ m(...) ---------- */
  function newSigmaExercise() {
    var f = FONC3[Math.floor(Math.random() * FONC3.length)];
    var m = listeMintermes(f);
    var comp = [];
    for (var i = 0; i < 8; i++) { if (m.indexOf(i) < 0) comp.push(i); }
    var cands = [];
    if (comp.length && comp.length < 8) cands.push({ t:'complement', l:comp });
    if (m.length > 1) cands.push({ t:'manquant', l:m.slice(1) });
    if (comp.length) cands.push({ t:'en trop', l:m.concat([comp[0]]).sort(function (a, b) { return a - b; }) });
    cands.push({ t:'decalage', l:m.map(function (x) { return (x + 1) % 8; }).sort(function (a, b) { return a - b; }) });
    cands.push({ t:'inverse', l:[7 - m[0]] });
    var seen = {}; seen[eqSigma(m)] = true;
    var wrong = [];
    shuffle(cands).forEach(function (c) {
      var s = eqSigma(c.l);
      if (!seen[s] && wrong.length < 3) { seen[s] = true; wrong.push({ html:s, ok:false }); }
    });
    var t = 0;
    while (wrong.length < 3 && t < 20) {
      t++;
      var r = Math.floor(Math.random() * 8), s2 = eqSigma([r]);
      if (!seen[s2]) { seen[s2] = true; wrong.push({ html:s2, ok:false }); }
    }
    return {
      kind:'sigma', f:f,
      tab:[null, null, null, null, null, null, null, null],
      options: shuffleChoices([{ html:eqSigma(m), ok:true }].concat(wrong)),
      picked:-1, done:false, ok:false
    };
  }

  function renderSigmaExercise(ex) {
    /* les valeurs attendues viennent de la fonction de l'exercice, pas du panneau voisin */
    var lignes = lignesFonc(ex.f);
    var table = '<table class="tt" id="ttSigma"><thead><tr><th>m</th><th>A</th><th>B</th><th>C</th><th>S</th></tr></thead><tbody>' +
      lignes.map(function (r) {

    }).join('');
    var bonne = eqSigma(listeMintermes(ex.f));
    var fb = ex.done

        '<span class="title">' + (ex.ok ? '✅ Exact !' : '❌ Non : ' + bonne) + '</span>' +

        'Rappel : le numéro d\'un minterme est la valeur binaire de (A, B, C) lue comme un nombre — ' +
        'la combinaison A = 0, B = 0, C = 0 porte le numéro <b>0</b>.' +
        '<br><b>Ta colonne S :</b> ' + (ex.tableJuste
          ? 'juste, 8 lignes sur 8 ✅'
          : '<b>' + ex.tableScore + ' ligne(s) juste(s) sur 8</b> — les bonnes valeurs sont affichées en vert, ' +
            'tes erreurs en rouge.') +
        '</div>'
      : '';
    return '<span class="qkind">Mini-exercice</span>' +
      '<h2>Quelle est l\'écriture condensée de cette fonction ?</h2>' +
      '<p class="lead">La fonction est donnée par <b>' + ex.f.eq() + '</b>. Remplis la colonne <b>S</b> de la table ' +
      '(clique sur une case : <b>?</b> → <b>1</b> → <b>0</b> → <b>?</b>), puis choisis la bonne écriture condensée.</p>' +
      '<p class="lead">La colonne <b>m</b> donne déjà le numéro de chaque minterme : c\'est la valeur binaire de ' +
      '(A, B, C) lue comme un nombre (la combinaison 000 porte le numéro 0, la combinaison 111 le numéro 7).</p>' +
      table +
      '<div class="choices" id="choicesExo">' + opts + '</div>' + fb +
      '<div class="actions">' +
      (ex.done ? '<button class="primary" id="btnExoNext">Nouvel exercice ▶</button>' : '') +
      '</div>';
  }

        { eq:'S = A·B·C',                    calc:function (v) { return (v[0] && v[1] && v[2]) ? 1 : 0; } }
      ],

  /* =====================================================================
     5 quater. PALIER 7 — équivalences remarquables
     Expressions sous forme d'arbre : {op:'var'|'const'|'not'|'and'|'or'}
     ===================================================================== */
  function V(n) { return { op:'var', n:n }; }
  function K(v) { return { op:'const', v:v }; }
  function NT(a) { return { op:'not', a:a }; }
  function AN(a, b) { return { op:'and', a:a, b:b }; }
  function OR(a, b) { return { op:'or', a:a, b:b }; }

  function exVars(e, acc) {
    acc = acc || [];
    if (e.op === 'var') { if (acc.indexOf(e.n) < 0) acc.push(e.n); return acc; }
    if (e.op === 'not') return exVars(e.a, acc);
    if (e.op === 'and' || e.op === 'or') { exVars(e.a, acc); return exVars(e.b, acc); }

  /* Ordre canonique A, B, C… sur toutes les variables d'une équivalence */
  function exVarsOf(a, b) {
    var all = exVars(a, []).concat(exVars(b, []));
    var u = [];
    all.forEach(function (n) { if (u.indexOf(n) < 0) u.push(n); });
    return u.sort();

  function combosOf(varsArr) {
    var n = varsArr.length, out = [], i, k, v;

      out.push(v);
    }
    return out;
  }
  function envOf(varsArr, v) {
    var env = {};
    varsArr.forEach(function (n, i) { env[n] = v[i]; });
    return env;
  }
  function exEval(e, env) {
    if (e.op === 'var') return env[e.n] ? 1 : 0;
    if (e.op === 'const') return e.v;
    if (e.op === 'not') return exEval(e.a, env) ? 0 : 1;
    if (e.op === 'and') return (exEval(e.a, env) && exEval(e.b, env)) ? 1 : 0;
    return (exEval(e.a, env) || exEval(e.b, env)) ? 1 : 0;

      return bar(inner);
    }
    var s = (e.op === 'and')
      ? exHTML(e.a, 'and') + '·' + exHTML(e.b, 'and')
      : exHTML(e.a, 'or') + ' + ' + exHTML(e.b, 'or');
    return (ctx === 'and' && e.op === 'or') ? '(' + s + ')' : s;
  }
  /* Deux expressions sont équivalentes si leurs tables de vérité sont identiques */
  function exEquiv(a, b) {
    var vars = exVarsOf(a, b);
    for (var i = 0; i < Math.pow(2, vars.length); i++) {
      var env = {}, rest = i;
      for (var k = vars.length - 1; k >= 0; k--) { env[vars[k]] = rest % 2; rest = Math.floor(rest / 2); }
      if (exEval(a, env) !== exEval(b, env)) return false;

  }

  var REGLES = [

  /* ---------- Mutations : fabriquer des réponses fausses ---------- */
  function mutSwap(e) {
    if (e.op === 'and') return OR(e.a, e.b);

    if (e.op === 'not') return NT(mutSwap(e.a) || e.a);
    return null;
  }
  function mutDrop(e) {
    if (e.op === 'and' || e.op === 'or') return (Math.random() < 0.5) ? e.a : e.b;
    if (e.op === 'not') return NT(mutDrop(e.a) || e.a);
    return null;

  function freeVarOf(e) {
    var cand = ['C','D','B'], u = exVars(e, []);

    return null;

    if (e.op === 'const') return null;
    var a = mutInvert(e.a, n), b = mutInvert(e.b, n);
    if (a) return (e.op === 'and') ? AN(a, e.b) : OR(a, e.b);
    if (b) return (e.op === 'and') ? AN(e.a, b) : OR(e.a, b);

  /* ---------- Exercices du palier 7 ---------- */
  function newEquivExercise(forceType) {
    var type = forceType || (Math.random() < 0.6 ? 'choix' : 'regle');
    for (var t = 0; t < 40; t++) {
      var r = REGLES[Math.floor(Math.random() * REGLES.length)];
      if (type === 'regle') {
        if (r.avant.op === 'not' && r.apres.op === 'var') continue;   /* règle d'écriture, pas de transformation visible */
        /* distracteurs : on écarte les règles qui, fonctionnellement, décrivent la même transformation
           (sinon plusieurs réponses seraient justifiables) */
        var noms = REGLES.filter(function (x) {
          if (x.nom === r.nom) return false;
          return !(exEquiv(x.avant, r.avant) && exEquiv(x.apres, r.apres));
        }).map(function (x) { return x.nom; });
        if (noms.length < 3) continue;
        var wrongN = shuffle(noms.slice()).slice(0, 3).map(function (n) { return { html:n, ok:false }; });
        var optsR = shuffleChoices([{ html:r.nom, ok:true }].concat(wrongN));
        return {
          kind:'equiv', type:'regle', r:r, avant:r.avant, apres:r.apres,
          titre:'Quelle règle a été appliquée ?',
          enonce:'On passe de <b>' + exHTML(r.avant) + '</b> à <b>' + exHTML(r.apres) + '</b> : ' +
            'quelle équivalence remarquable a été utilisée ?',
          expl:'',
          options: optsR, choices: optsR,
          picked:-1, done:false, ok:false
        };
      }
      /* type « choix » : trouver une écriture équivalente */
      var cible = r.apres;
      var cands = [mutSwap(cible), mutDrop(cible), mutAdd(cible)];
      exVars(cible, []).forEach(function (n, i) { if (i < 2) cands.push(mutInvert(cible, n)); });
      cands.push(mutSwap(r.avant));
      var seen = {}, wrong = [];
      seen[exHTML(cible)] = true;
      shuffle(cands).forEach(function (c) {
        if (!c || wrong.length >= 3) return;
        var k = exHTML(c);
        if (seen[k]) return;
        if (exEquiv(c, cible)) return;         /* un faux équivalent rendrait la question ambiguë */
        seen[k] = true;
        wrong.push({ html:k, ok:false });
      });
      if (wrong.length < 3) continue;
      var opts = shuffleChoices([{ html:exHTML(cible), ok:true }].concat(wrong));
      return { kind:'equiv', type:'choix', r:r, avant:r.avant, apres:r.apres, cible:cible,
        titre:'Quelle écriture est équivalente ?',
        enonce:'Parmi ces écritures, une seule décrit la même fonction que l\'expression ci-dessus : ' +
          'les autres ont été vérifiées, leur table de vérité est différente.',
        expl:'',
        options:opts, choices:opts, picked:-1, done:false, ok:false };
    }

      titre:'Quelle écriture est équivalente ?',
      enonce:'Parmi ces écritures, une seule décrit la même fonction que l\'expression ci-dessus.',
      expl:'', options:shuffleChoices(o), choices:o, picked:-1, done:false, ok:false };
  }

  /* ---------- Formes canoniques génériques (2 variables ou plus) ---------- */

    }).join(' + ');

          return '<tr class="' + (r.o ? 'one' : '') + '">' +
            r.v.map(function (x) { return '<td>' + x + '</td>'; }).join('') +
            '<td class="out">' + r.o + '</td></tr>';
        }).join('') + '</tbody></table>';
      dossier = '<h3>2. Le dossier technique corrigé</h3>' +
        '<table class="voc"><tbody>' +
        '<tr><th>Variables</th><td>' + M.vars.map(function (v, i) { return '<b>' + v + '</b> : ' + M.conv[i]; }).join('<br>') + '</td></tr>' +
        '<tr><th>Équation</th><td>' + M.eq + '</td></tr>' +
        '<tr><th>Montage</th><td>' + M.montage + '</td></tr>' +
        '<tr><th>Combinaisons à 1<br><span class="mini">m = numéro du minterme</span></th><td>' + (mins.length
          ? mins.map(function (r) { return r.v.join('') + ' <span class="mini">m' + r.i + '</span>'; }).join(' &nbsp;·&nbsp; ')
          : 'aucune') + '</td></tr>' +
        '<tr><th>Forme canonique</th><td>' + canoniqueOf(M.calc, M.vars) + '</td></tr>' +
        '<tr><th>Écriture condensée</th><td>' + sigmaOf(M.calc, M.vars) + '</td></tr>' +
        '</tbody></table>' + table;
    }
    return '<span class="qkind">Mission</span>' +
      '<h2>' + M.titre + '</h2>' +
      '<p class="lead">' + M.enonce + '</p>' +
      '<h3>1. Traduire l\'énoncé en équation</h3>' +
      '<div class="choices" id="choicesExo">' + opts + '</div>' + fb + dossier +
      '<div class="actions">' +
      (ex.picked >= 0 ? '<button class="primary" id="btnExoNext">Mission suivante ▶</button>' : '') +
      '</div>';
  }

  function renderPalier8() {
    return '<section class="card">' +
      '<span class="qkind">Palier 8 · Avancé</span>' +
      '<h2>Missions : le cahier des charges complet</h2>' +
      '<p class="lead">Tout est réuni : lire un énoncé, nommer les variables, écrire l\'équation, vérifier avec la ' +
      'table de vérité, puis produire la forme canonique et l\'écriture condensée. Chaque mission fournit le ' +
      '<b>dossier technique corrigé</b>.</p>' +
      '<h3>La méthode</h3>' +
      '<ol>' +
      '<li>Nommer une variable par information d\'entrée.</li>' +
      '<li>Fixer la convention : que signifie <b>1</b> pour chaque variable ?</li>' +
      '<li>Repérer les mots de la logique (« et », « ou », « sauf si », « mais pas les deux »).</li>' +
      '<li>Écrire l\'équation, puis la vérifier sur la table de vérité.</li>' +
      '<li>Terminer par la forme canonique et l\'écriture condensée Σ m(...).</li>' +
      '</ol>' +
      '</section>' +
      '<section class="card" id="exoZone"></section>' +
      '<section class="card">' +
      '<span class="qkind">Bilan</span>' +
      '<h2>Bilan complet (note sur 20)</h2>' +
      '<p class="lead">Dix questions tirées de tous les paliers : fonctions de base, fonctions universelles, ' +
      'OU-exclusif, forme canonique et équivalences remarquables. Le bilan se termine par un récapitulatif ' +
      'groupé par thème, pour savoir précisément quoi revoir.</p>' +
      '<div class="actions"><button class="primary" data-bilan="tout">Lancer le bilan complet ▶</button></div>' +
      '</section>';
  }

  /* =====================================================================
     6. RENDU
     ===================================================================== */
  function render() {
    var html = '';
    if (state.view === 'parcours') html = viewParcours();
    else if (state.view === 'p1') { html = renderPalier1(); }
    else if (state.view === 'p2') { html = renderPalier2(); }
    else if (state.view === 'p3') { html = renderPalier3(); }
    else if (state.view === 'p4') { html = renderPalier4(); }
    else if (state.view === 'p5') { html = renderPalier5(); }
    else if (state.view === 'p6') { html = renderPalier6(); }
    else if (state.view === 'p7') { html = renderPalier7(); }
    else if (state.view === 'p8') { html = renderPalier8(); }
    else if (state.view === 'defi') html = viewDefi();
    else if (state.view === 'memo') html = viewMemo();
    el.view.innerHTML = html;

    Array.prototype.forEach.call(document.querySelectorAll('.mode-btn'), function (b) {
      b.classList.toggle('active', b.getAttribute('data-view') === state.view);
    });

    if (state.view === 'p1') {
      buildSandbox(false); updateLive();
      if (!state.ex || state.ex.kind !== 'ident') state.ex = newIdentExercise();
      renderExerciseInto(false);
    }
    if (state.view === 'p2' || state.view === 'p5' || state.view === 'p6') {
      buildSandbox(true); updateLive();
      if (!state.ex || state.ex.kind !== 'combi') state.ex = newCombiExercise();
      renderExerciseInto(false);
    }
    if (state.view === 'p3') {
      if (!state.ex || state.ex.kind !== 'sigma') state.ex = newSigmaExercise();
      renderExerciseInto(false);
    }
    if (state.view === 'p4') {
      if (!state.ex || state.ex.kind !== 'scenario') state.ex = newScenarioExercise();
      renderExerciseInto(false);
    }
    if (state.view === 'p7') {
      if (!state.ex || state.ex.kind !== 'equiv') state.ex = newEquivExercise();
      renderExerciseInto(false);
    }
    if (state.view === 'p8') {
      if (!state.ex || state.ex.kind !== 'mission') state.ex = newMissionExercise();
      renderExerciseInto(false);
    }
    if (state.view === 'defi') { wireDefi(); }
    updateStats();
    scheduleResize();
  }

  function updateStats() {
    if (state.view === 'defi' && state.defi) {
      el.score.textContent = Math.round(state.defi.correct / state.defi.total * 20);
      el.scoreLbl.textContent = 'note sur 20';
    } else {
      el.score.textContent = state.score;
      el.scoreLbl.textContent = 'points';
    }
    el.info.textContent = state.view === 'parcours' ? 'Parcours'
      : state.view === 'p1' ? 'Palier 1 · 0 et 1'
      : state.view === 'p2' ? 'Palier 2 · NON, ET, OU'
      : state.view === 'p3' ? 'Palier 3 · forme canonique'
      : state.view === 'p4' ? 'Palier 4 · du français à la logique'
      : state.view === 'p5' ? 'Palier 5 · fonctions universelles'
      : state.view === 'p6' ? 'Palier 6 · OU-exclusif'
      : state.view === 'p7' ? 'Palier 7 · équivalences remarquables'
      : state.view === 'p8' ? 'Palier 8 · missions'
      : state.view === 'defi' ? (state.defi ? 'Défi · question ' + Math.min(state.defi.index + 1, state.defi.total) + ' / ' + state.defi.total : 'Défi')
      : 'Mémo';
  }

  /* ---------- Bac à sable : squelette puis mise à jour ciblée ---------- */
  function buildSandbox(withPicker) {
    var vars = sandboxVars();
    var swZone = document.getElementById('switchZone');
    /* Au palier 1, l'étude porte sur une seule variable : on n'affiche que A. */
    var shown = (state.view === 'p1') ? ['A'] : ['A','B','C'];
    swZone.innerHTML = shown.map(function (v) {
      var on = vars.indexOf(v) >= 0;
      return '<button class="switch" role="switch" data-sw="' + v + '" aria-checked="' + (state.sw[v] ? 'true' : 'false') + '"' +
        (on ? '' : ' disabled') + '>' +
        '<span class="sw-name">' + v + '</span>' +
        '<span class="sw-knob" aria-hidden="true"></span>' +
        '<span class="sw-state">' + state.sw[v] + '</span></button>';
    }).join('');

    if (withPicker) {
      var cur = sandboxFn();
      var pick = sandboxFnList().map(function (id) {
        return '<button data-fn="' + id + '"' + (cur === id ? ' class="active"' : '') + '>' + FUNCS[id].long + '</button>';
      }).join('');
      var bouton3 = (FUNCS[cur].maxVars === 3)
        ? '<button id="btnThird" class="extra' + (state.third ? ' active' : '') + '" data-third="1">' +
          (state.third ? '✓ ' : '+ ') + '3<sup>e</sup> entrée C</button>'
        : '';
      document.getElementById('fnPicker').innerHTML = pick + bouton3;
    }

    var fid = sandboxFn();
    document.getElementById('circuitZone').innerHTML = svgSchema(fid, vars);
    var pt = document.getElementById('panelTitle');
    if (pt) pt.textContent = (['NAND','NOR','XOR'].indexOf(fid) >= 0) ? 'Le logigramme' : 'Le montage';
    document.getElementById('gateZone').innerHTML = svgGate(fid, vars);
    document.getElementById('eqZone').innerHTML = FUNCS[fid].eq(vars);
    /* la phrase contient des mises en valeur (<b>) : il faut l'injecter en HTML, pas en texte */
    document.getElementById('eqCap').innerHTML = FUNCS[fid].phrase;
    if (document.getElementById('whyZone'))
      document.getElementById('whyZone').innerHTML = '<b>Pourquoi ça marche —</b> ' + FUNCS[fid].why;
    if (document.getElementById('convZone'))
      document.getElementById('convZone').innerHTML = '<b>Conventions —</b> <span class="op">·</span> ET ' +
        '<span class="op">+</span> OU ' + '<span class="ovl">A</span> NON. ' +
        'La sortie est notée <b>S</b> (ici, la lampe). ' +
        'Le cercle à la sortie du symbole signifie « inverse » (norme NF EN 60617).';
    var cap = document.getElementById('ttCap');
    if (cap) cap.textContent = (state.view === 'p1')
      ? 'Table de vérité : 1 variable, 2 lignes'
      : 'Table de vérité de ' + FUNCS[fid].long;
    renderTruthTable('ttZone');
  }

  /* Fonction utilisée par le bac à sable : identité au palier 1, fonction choisie ensuite */
  function sandboxFn() {
    if (state.view === 'p1') return 'IDENT';
    var l = sandboxFnList();
    return l.indexOf(state.fn) >= 0 ? state.fn : l[0];
  }

  /* Fonctions proposées selon le palier */
  function sandboxFnList() {
    if (state.view === 'p5') return ['NAND','NOR','NON','ET','OU'];
    if (state.view === 'p6') return ['XOR','OU','NON'];
    return ['NON','ET','OU'];
  }

  /* Variables utilisées par le bac à sable (une seule au palier 1) */
  function sandboxVars() { return state.view === 'p1' ? ['A'] : activeVars(); }

  function renderTruthTable(zoneId) {
    var vars = sandboxVars();
    var fnId = sandboxFn();
    var rows = allRows(fnId, vars);
    var cur = vars.map(function (v) { return state.sw[v]; }).join('');
    var head = vars.map(function (v) { return '<th>' + v + '</th>'; }).join('') + '<th>S</th>';
    var body = rows.map(function (r, i) {
      var isCur = r.v.join('') === cur;
      return '<tr data-row="' + i + '" data-combo="' + r.v.join('') + '" data-out="' + r.o + '"' +
        (isCur ? ' class="cur"' : '') + '>' +
        r.v.map(function (x) { return '<td>' + x + '</td>'; }).join('') +
        '<td class="out">' + r.o + '</td></tr>';
    }).join('');
    document.getElementById(zoneId).innerHTML =
      '<thead><tr>' + head + '</tr></thead><tbody>' + body + '</tbody>';
  }

  /* Mise à jour ciblée : pas de perte de focus, pas de redémarrage d'animation */
  function updateLive() {
    var vars = sandboxVars();
    var fnId = sandboxFn();
    var f = FUNCS[fnId];
    var combo = vars.map(function (v) { return state.sw[v]; }).join('');
    var out = evalFn(fnId, vars.map(function (v) { return state.sw[v]; }));

    /* interrupteurs */
    Array.prototype.forEach.call(document.querySelectorAll('.switch'), function (b) {
      var v = b.getAttribute('data-sw');
      var on = vars.indexOf(v) >= 0;
      b.disabled = !on;
      b.setAttribute('aria-checked', state.sw[v] ? 'true' : 'false');
      b.querySelector('.sw-state').textContent = state.sw[v];
    });

    /* contacts du schéma */
    Array.prototype.forEach.call(document.querySelectorAll('#circuit .contact'), function (g) {
      var v = g.getAttribute('data-contact');
      /* contact travail : fermé si la variable vaut 1 ; contact repos (NON) : fermé si elle vaut 0 */
      var closed = (fnId === 'NON') ? (state.sw[v] === 0) : (state.sw[v] === 1);
      g.classList.toggle('closed', !!closed);
    });

    var circ = document.getElementById('circuit');
    if (circ) {
      circ.setAttribute('data-lit', out ? '1' : '0');
      circ.classList.toggle('live', !!out);
    }
    var lamp = document.getElementById('lampG');
    if (lamp) lamp.classList.toggle('lit', !!out);

    /* table de vérité */
    Array.prototype.forEach.call(document.querySelectorAll('#ttZone tbody tr'), function (tr) {
      tr.classList.toggle('cur', tr.getAttribute('data-combo') === combo);
    });

    /* ligne d'état */
    var line = document.getElementById('stateLine');
    if (line) {
      line.innerHTML = vars.map(function (v) { return v + ' = <b>' + state.sw[v] + '</b>'; }).join(' · ') +
        ' &nbsp;⟹&nbsp; S = <b>' + out + '</b> ' + (out ? '— lampe allumée' : '— lampe éteinte');
    }
    updateStats();
    scheduleResize();
  }

  /* =====================================================================
     7. EXERCICES
     ===================================================================== */
  function renderExerciseInto(createNew) {
    var zone = document.getElementById('exoZone');
    if (!zone) return;
    if (createNew && !state.ex) state.ex = newCombiExercise();
    zone.innerHTML = renderExercise();
    wireExercise();
  }

  function wireExercise() {
    var ex = state.ex;
    if (!ex) return;
    if (ex.kind === 'ident') {
      Array.prototype.forEach.call(document.querySelectorAll('#choicesExo button'), function (b) {
        b.addEventListener('click', function () {
          var v = Number(b.getAttribute('data-ans'));
          ex.picked = v; ex.done = true; ex.ok = (v === ex.lit);
          if (ex.ok) state.score++;
          renderExerciseInto(false);
          updateStats();
        });
      });
      var nx1 = document.getElementById('btnExoNext');
      if (nx1) nx1.addEventListener('click', function () { state.ex = newIdentExercise(); renderExerciseInto(false); });
      return;
    }
    if (ex.kind === 'sigma') {
      /* la colonne S se remplit au clic : ? → 1 → 0 → ? */
      Array.prototype.forEach.call(document.querySelectorAll('#ttSigma td[data-srow]'), function (td) {
        td.addEventListener('click', function () {
          if (ex.done) return;
          ex.tab = ex.tab || [];
          var r = Number(td.getAttribute('data-srow'));
          var cur = ex.tab[r];
          var nv = (cur === null || cur === undefined) ? 1 : (cur === 1 ? 0 : null);
          ex.tab[r] = nv;
          td.textContent = (nv === null) ? '?' : String(nv);
          td.classList.toggle('v1', nv === 1);
          td.classList.toggle('v0', nv === 0);
        });
      });
      Array.prototype.forEach.call(document.querySelectorAll('#choicesExo button'), function (b) {
        b.addEventListener('click', function () {
          var i = Number(b.getAttribute('data-opt'));
          ex.picked = i; ex.done = true; ex.ok = ex.options[i].ok;
          /* on corrige aussi la table remplie par l'élève */
          var L = lignesFonc(ex.f), juste = 0, k;
          for (k = 0; k < L.length; k++) { if ((ex.tab || [])[L[k].i] === L[k].o) juste++; }
          ex.tableScore = juste;
          ex.tableJuste = (juste === L.length);
          if (ex.ok) state.score++;
          renderExerciseInto(false); updateStats();
        });
      });
      var nx3 = document.getElementById('btnExoNext');
      if (nx3) nx3.addEventListener('click', function () { state.ex = newSigmaExercise(); renderExerciseInto(false); });
      return;
    }
    if (ex.kind === 'scenario') {
      Array.prototype.forEach.call(document.querySelectorAll('#choicesExo button'), function (b) {
        b.addEventListener('click', function () {
          if (ex.picked >= 0) return;
          var i = Number(b.getAttribute('data-opt'));
          ex.picked = i; ex.ok = !!ex.options[i].ok;
          if (ex.ok) {
            state.score++;
            var c = [];
            for (var k = 0; k < ex.s.vars.length; k++) { c.push(Math.random() < 0.5 ? 0 : 1); }
            ex.combo = c;
            ex.attendu = ex.refCalc(c);
          }
          renderExerciseInto(false); updateStats();
        });
      });
      Array.prototype.forEach.call(document.querySelectorAll('#choicesExo2 button'), function (b) {
        b.addEventListener('click', function () {
          if (ex.rep !== null) return;
          ex.rep = Number(b.getAttribute('data-rep'));
          ex.ok2 = (ex.rep === ex.attendu);
          if (ex.ok2) state.score++;
          renderExerciseInto(false); updateStats();
        });
      });
      var nx4 = document.getElementById('btnExoNext');
      if (nx4) nx4.addEventListener('click', function () { state.ex = newScenarioExercise(); renderExerciseInto(false); });
      return;
    }
    if (ex.kind === 'equiv') {
      Array.prototype.forEach.call(document.querySelectorAll('#choicesExo button'), function (b) {
        b.addEventListener('click', function () {
          if (ex.done) return;
          var i = Number(b.getAttribute('data-opt'));
          ex.picked = i; ex.done = true; ex.ok = !!ex.options[i].ok;
          if (ex.ok) state.score++;
          renderExerciseInto(false); updateStats();
        });
      });
      var nx5 = document.getElementById('btnExoNext');
      if (nx5) nx5.addEventListener('click', function () { state.ex = newEquivExercise(); renderExerciseInto(false); });
      return;
    }
    if (ex.kind === 'mission') {
      Array.prototype.forEach.call(document.querySelectorAll('#choicesExo button'), function (b) {
        b.addEventListener('click', function () {
          if (ex.picked >= 0) return;
          var i = Number(b.getAttribute('data-opt'));
          ex.picked = i; ex.ok = !!ex.options[i].ok;
          if (ex.ok) state.score++;
          renderExerciseInto(false); updateStats();
        });
      });
      var nx6 = document.getElementById('btnExoNext');
      if (nx6) nx6.addEventListener('click', function () { state.ex = newMissionExercise(); renderExerciseInto(false); });
      return;
    }
    var table = document.getElementById('ttExo');
    if (table && !ex.done) {
      Array.prototype.forEach.call(table.querySelectorAll('tbody tr'), function (tr) {
        tr.addEventListener('click', function () {
          var i = Number(tr.getAttribute('data-row'));
          ex.sel[i] = !ex.sel[i];
          tr.classList.toggle('sel', !!ex.sel[i]);
        });
      });
      var ok = document.getElementById('btnExoOk');
      if (ok) ok.addEventListener('click', function () { checkCombi(ex, true); renderExerciseInto(false); updateStats(); });
    }
    var next = document.getElementById('btnExoNext');
    if (next) next.addEventListener('click', function () { state.ex = newCombiExercise(); renderExerciseInto(false); });
  }

  function checkCombi(ex, countPoints) {
    var expected = onesOf(ex.fn, ex.vars);
    var given = [];
    Object.keys(ex.sel).forEach(function (k) { if (ex.sel[k]) given.push(k); });
    var rows = allRows(ex.fn, ex.vars);
    given = given.map(function (i) { return rows[Number(i)].v.join(''); }).sort();
    expected = expected.slice().sort();
    ex.done = true;
    ex.ok = given.length === expected.length && given.every(function (v, i) { return v === expected[i]; });
    if (ex.ok && countPoints) state.score++;
    return ex.ok;
  }

  /* =====================================================================
     8. DÉFI
     ===================================================================== */
  function startDefi(set) {
    state.defi = {
      total:10, index:0, correct:0, streak:0, best:0, errors:[], asked:{},
      set:set || 'bases',
      startedAt:Date.now(), finished:false, q:null
    };
    state.defi.q = newDefiQuestion();
  }

  /* Banques de questions, avec le thème pour le récapitulatif final */
  var DEFI_BASES = [
    { fn:'NON', vars:['A'], theme:'Palier 1-2 · NON, ET, OU' },
    { fn:'ET',  vars:['A','B'], theme:'Palier 1-2 · NON, ET, OU' },
    { fn:'ET',  vars:['A','B','C'], theme:'Palier 1-2 · NON, ET, OU' },
    { fn:'OU',  vars:['A','B'], theme:'Palier 1-2 · NON, ET, OU' },
    { fn:'OU',  vars:['A','B','C'], theme:'Palier 1-2 · NON, ET, OU' }
  ];
  var DEFI_AVANCE = [
    { fn:'NAND', vars:['A','B'], theme:'Palier 5 · NON-ET et NON-OU' },
    { fn:'NAND', vars:['A','B','C'], theme:'Palier 5 · NON-ET et NON-OU' },
    { fn:'NOR',  vars:['A','B'], theme:'Palier 5 · NON-ET et NON-OU' },
    { fn:'NOR',  vars:['A','B','C'], theme:'Palier 5 · NON-ET et NON-OU' },
    { fn:'XOR',  vars:['A','B'], theme:'Palier 6 · OU-exclusif' },
    { fn:'ET',   vars:['A','B','C'], theme:'Palier 3 · forme canonique' },
    { fn:'OU',   vars:['A','B'], theme:'Palier 1-2 · NON, ET, OU' }
  ];

  function newDefiQuestion() {
    var avance = state.defi.set === 'tout';
    var pool = avance ? DEFI_BASES.concat(DEFI_AVANCE) : DEFI_BASES;
    var kinds = avance ? ['combi','combi','qcm','qcm','sigma','equiv','equiv'] : ['combi','qcm'];
    for (var t = 0; t < 80; t++) {
      var type = kinds[Math.floor(Math.random() * kinds.length)];

      /* QCM d'équivalence (palier 7) */
      if (type === 'equiv') {
        var e = newEquivExercise();
        if (!e) continue;
        var ke = 'equiv|' + e.r.nom + '|' + e.type + '|' + Math.floor(Math.random() * 4);
        if (state.defi.asked[ke]) continue;
        state.defi.asked[ke] = true;
        e.theme = 'Palier 7 · équivalences remarquables';
        e.expl = 'Règle utilisée : <b>' + e.r.nom + '</b> — ' + e.r.expl;
        e.errorLabel = 'équivalence : ' + exHTML(e.avant) + ' → ' + exHTML(e.apres);
        return e;
      }

      var p = pool[Math.floor(Math.random() * pool.length)];
      var key = type + '|' + p.fn + '|' + p.vars.join('');
      if (state.defi.asked[key]) continue;
      state.defi.asked[key] = true;

      if (type === 'combi') return {
        kind:'combi', fn:p.fn, vars:p.vars, sel:{}, done:false, ok:false,
        theme:p.theme,
        errorLabel:'S = 1 pour ' + onesOf(p.fn, p.vars).join(', ') + ' &nbsp;— entrées ' + p.vars.join(', '),
        given:['equation','montage','symbol'][Math.floor(Math.random() * 3)]
      };

      if (type === 'sigma') {
        var m = onesOf(p.fn, p.vars).map(function (c) { return parseInt(c, 2); });
        return { kind:'qcm', fn:p.fn, vars:p.vars, shown:'equation', theme:'Palier 3 · forme canonique',
          choices: sigmaChoices(m, p.vars.length),
          expl:'La fonction vaut 1 pour les combinaisons <b>' + onesOf(p.fn, p.vars).join(', ') +
            '</b>, donc pour les mintermes <b>' + m.join(', ') + '</b> : on écrit Σ m(...). ' +
            'Le numéro d\'un minterme est la valeur binaire de (' + p.vars.join(', ') +
            ') lue comme un nombre : la combinaison 000 porte le numéro 0.',
          errorLabel:'écriture condensée de ' + FUNCS[p.fn].eq(p.vars),
          done:false, ok:false, picked:-1 };
      }

      /* QCM : 4 équations, une seule correcte (tables différentes) */
      var good = FUNCS[p.fn].eq(p.vars);
      var cands = [];
      ['ET','OU','NAND','NOR'].forEach(function (id) {
        if (id !== p.fn && FUNCS[id].maxVars >= p.vars.length) cands.push(FUNCS[id].eq(p.vars));
      });
      p.vars.forEach(function (v) { cands.push('S = ' + bar(v)); });
      var seen = {}; seen[good] = true;
      var wrong = [];
      shuffle(cands).forEach(function (c) { if (!seen[c] && wrong.length < 3) { seen[c] = true; wrong.push(c); } });
      if (wrong.length < 3) continue;
      var choices = [{ html:good, ok:true }].concat(wrong.map(function (w) { return { html:w, ok:false }; }));
      return { kind:'qcm', fn:p.fn, vars:p.vars, choices:shuffleChoices(choices), done:false, ok:false, picked:-1,
               theme:p.theme, expl:FUNCS[p.fn].why,
               errorLabel:FUNCS[p.fn].eq(p.vars) + ' &nbsp;— entrées ' + p.vars.join(', ') };
    }
    return { kind:'combi', fn:'ET', vars:['A','B'], sel:{}, done:false, ok:false, given:'equation',
             theme:'Palier 1-2 · NON, ET, OU', errorLabel:'S = 1 pour 11' };
  }

  /* Propositions de Σ m(...) : la bonne, puis des listes fausses et vérifiées */
  function sigmaChoices(m, nbits) {
    var total = Math.pow(2, nbits), comp = [], i;
    for (i = 0; i < total; i++) { if (m.indexOf(i) < 0) comp.push(i); }
    var cands = [];
    if (comp.length && comp.length < total) cands.push(comp);
    if (m.length > 1) cands.push(m.slice(1));
    if (comp.length) cands.push(m.concat([comp[0]]).sort(function (a, b) { return a - b; }));
    cands.push(m.map(function (x) { return (x + 1) % total; }).sort(function (a, b) { return a - b; }));
    cands.push([total - 1 - m[0]]);
    var seen = {}; seen[eqSigma(m)] = true;
    var wrong = [];
    shuffle(cands).forEach(function (c) {
      var s = eqSigma(c);
      if (!seen[s] && wrong.length < 3) { seen[s] = true; wrong.push({ html:s, ok:false }); }
    });
    for (var k = 0; wrong.length < 3 && k < 40; k++) {
      var r = Math.floor(Math.random() * total), s2 = eqSigma([r]);
      if (!seen[s2]) { seen[s2] = true; wrong.push({ html:s2, ok:false }); }
    }
    return shuffleChoices([{ html:eqSigma(m), ok:true }].concat(wrong));
  }

  function wireDefi() {
    var d = state.defi;
    if (!d || d.finished) {
      var rp = document.getElementById('btnDefiReplay');
      if (rp) rp.addEventListener('click', function () { startDefi(d && d.set); render(); });
      return;
    }
    var q = d.q;
    var table = document.getElementById('ttDefi');
    if (q.kind === 'combi' && table && !q.done) {
      Array.prototype.forEach.call(table.querySelectorAll('tbody tr'), function (tr) {
        tr.addEventListener('click', function () {
          var i = Number(tr.getAttribute('data-row'));
          q.sel[i] = !q.sel[i];
          tr.classList.toggle('sel', !!q.sel[i]);
        });
      });
      document.getElementById('btnDefiOk').addEventListener('click', function () {
        var okNow = checkCombi(q, false);
        finishDefiQuestion(okNow);
      });
    }
    if ((q.kind === 'qcm' || q.kind === 'equiv') && !q.done) {
      Array.prototype.forEach.call(document.querySelectorAll('#choicesDefi button'), function (b, i) {
        b.addEventListener('click', function () {
          q.picked = i;
          q.done = true;
          q.ok = q.choices[i].ok;
          finishDefiQuestion(q.ok);
        });
      });
    }
    var nx = document.getElementById('btnDefiNext');
    if (nx) nx.addEventListener('click', function () {
      var d2 = state.defi;
      d2.index++;
      if (d2.index >= d2.total) { d2.finished = true; render(); return; }
      d2.q = newDefiQuestion();
      render();
    });
  }

  function finishDefiQuestion(ok) {
    var d = state.defi, q = d.q;
    if (q.scored) return;
    q.scored = true;
    q.ok = ok;
    if (ok) {
      d.correct++;
      d.streak++;
      if (d.streak > d.best) d.best = d.streak;
    } else {
      d.streak = 0;
      d.errors.push({
        theme: q.theme || 'Palier 1-2 · NON, ET, OU',
        label: q.errorLabel || (FUNCS[q.fn].eq(q.vars) + ' &nbsp;— entrées ' + q.vars.join(', '))
      });
    }
    render();
  }

  /* =====================================================================
     9. MÉLANGE (bonne réponse jamais deux fois de suite à la même place)
     ===================================================================== */
  function shuffle(a) {
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function correctIndex(arr) {
    for (var i = 0; i < arr.length; i++) { if (arr[i].ok) return i; }
    return -1;
  }
  function shuffleChoices(choices) {
    var arr = choices.slice(), ci = -1;
    for (var t = 0; t < 12; t++) {
      shuffle(arr);
      ci = correctIndex(arr);
      if (ci < 0 || ci !== state.lastCorrectPos) break;
    }
    if (ci === state.lastCorrectPos && arr.length > 1) {
      var sw = (ci + 1) % arr.length, tmp = arr[ci];
      arr[ci] = arr[sw]; arr[sw] = tmp; ci = sw;
    }
    state.lastCorrectPos = ci;
    return arr;
  }

  /* =====================================================================
     10. ÉVÉNEMENTS GLOBAUX
     ===================================================================== */
  el.view.addEventListener('click', function (ev) {
    var b = ev.target.closest ? ev.target.closest('button') : null;

    /* navigation */
    if (b && b.hasAttribute('data-goto')) { state.view = b.getAttribute('data-goto'); render(); return; }
    /* interrupteurs */
    if (b && b.hasAttribute('data-sw')) {
      var v = b.getAttribute('data-sw');
      state.sw[v] = state.sw[v] ? 0 : 1;
      updateLive();
      return;
    }
    /* choix de fonction */
    if (b && b.hasAttribute('data-fn')) {
      state.fn = b.getAttribute('data-fn');
      if (FUNCS[state.fn].maxVars < 3) state.third = false;
      buildSandbox(true); updateLive();
      return;
    }
    if (b && b.hasAttribute('data-third')) {
      state.third = !state.third;
      buildSandbox(true); updateLive();
      return;
    }
    if (b && b.hasAttribute('data-f3')) {
      for (var i3 = 0; i3 < FONC3.length; i3++) {
        if (FONC3[i3].id === b.getAttribute('data-f3')) state.f3 = i3;
      }
      render();
      return;
    }
    /* règle étudiée au palier 7 */
    if (b && b.hasAttribute('data-r7')) { state.r7 = Number(b.getAttribute('data-r7')); render(); return; }
    /* bilan complet : défi tiré de tous les paliers */
    if (b && b.hasAttribute('data-bilan')) {
      state.view = 'defi'; state.ex = null; startDefi(b.getAttribute('data-bilan')); render(); return;
    }
    /* la table de vérité pilote le montage */
    var tr = ev.target.closest ? ev.target.closest('tr[data-combo]') : null;
    if (tr) {
      var combo = tr.getAttribute('data-combo');
      sandboxVars().forEach(function (v, i) {
        state.sw[v] = Number(combo.charAt(i));
      });
      updateLive();
    }
  });

  Array.prototype.forEach.call(document.querySelectorAll('.mode-btn'), function (b) {
    b.addEventListener('click', function () {
      state.view = b.getAttribute('data-view');
      state.ex = null;
      render();
    });
  });

  el.reset.addEventListener('click', function () {
    state.score = 0;
    state.sw = {A:0,B:0,C:0};
    state.third = false;
    state.ex = null;
    state.defi = null;
    if (state.view === 'defi') startDefi();
    render();
  });

  /* hauteur automatique de l'iframe d'intégration */
  function notifyHeight() {
    try {
      if (window.parent === window) return;
      window.parent.postMessage({ type:'iframe-resize', id:'logique', height:document.body.scrollHeight }, '*');
    } catch (e) {}
  }
  var resizeTimer = null;
  function scheduleResize() { clearTimeout(resizeTimer); resizeTimer = setTimeout(notifyHeight, 60); }
  window.addEventListener('resize', scheduleResize);
  window.addEventListener('load', scheduleResize);

  render();
})();
</script>
